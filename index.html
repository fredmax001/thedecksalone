<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Deck Salone — Sierra Leone's Official DJ Platform</title>

    
    <meta name="description" content="Discover top DJs, listen to exclusive Sierra Leonean mixes, book DJs for events, and experience live DJ battles on Deck Salone." />
    <meta name="keywords" content="Deck Salone, Sierra Leone DJs, Salone DJs, Freetown DJs, Sierra Leone music streaming, book DJ Sierra Leone, Sierra Leone mixtapes, Afrobeats Sierra Leone, Amapiano Salone, DJ rankings Sierra Leone, DJ battle Sierra Leone, Sierra Leone event tickets, DJ Fred Max" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://decksalone.com/" />
    <meta name="robots" content="index, follow" />

    <!-- Structured Data (JSON-LD) for Search Engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://decksalone.com/#organization",
          "name": "Deck Salone",
          "url": "https://decksalone.com/",
          "logo": "https://decksalone.com/og-image.jpg",
          "description": "Sierra Leone's Official DJ Platform — Discover, Stream & Book Top Salone DJs."
        },
        {
          "@type": "WebSite",
          "@id": "https://decksalone.com/#website",
          "url": "https://decksalone.com/",
          "name": "Deck Salone",
          "description": "Sierra Leone's Official DJ Platform",
          "publisher": {
            "@id": "https://decksalone.com/#organization"
          },
          "potentialAction": {
            "@type": "SearchAction",
            "target": "https://decksalone.com/discover?q={search_term_string}",
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://decksalone.com/" />
    <meta property="og:title" content="Deck Salone — Sierra Leone's Official DJ Platform" />
    <meta property="og:description" content="Discover top DJs, listen to exclusive Sierra Leonean mixes, book DJs for events, and experience live DJ battles on Deck Salone." />
    <meta property="og:image" content="https://decksalone.com/og-image.jpg?v=5" />
    <meta property="og:image:secure_url" content="https://decksalone.com/og-image.jpg?v=5" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Deck Salone — Home for Salone DJs" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://decksalone.com/" />
    <meta property="twitter:title" content="Deck Salone — Sierra Leone's Official DJ Platform" />
    <meta property="twitter:description" content="Discover top DJs, listen to exclusive Sierra Leonean mixes, book DJs for events, and experience live DJ battles on Deck Salone." />
    <meta name="twitter:image" content="https://decksalone.com/og-image.jpg?v=5" />

    <!-- PWA & Mobile Web App Meta Tags -->
    <meta name="theme-color" content="#000000" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Deck Salone" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=5" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=5" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=5" />
  </head>
  <body class="bg-black text-text-primary" style="background-color: #000000; margin: 0;">
    <!-- Official Deck Salone Splash Screen -->
    <div
      id="deck-salone-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 999999;
        background-color: #000000;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100vw;
        height: 100dvh;
        opacity: 1;
        transition: opacity 400ms cubic-bezier(0.4, 0, 0.2, 1), visibility 400ms ease;
        pointer-events: all;
        overflow: hidden;
      "
      aria-hidden="true"
    >
      <div
        style="
          display: flex;
          align-items: center;
          justify-content: center;
          width: 100%;
          height: 100%;
          padding: 24px;
          box-sizing: border-box;
        "
      >
        <img
          src="/logo-mobile.png"
          alt="Deck Salone"
          width="210"
          height="232"
          style="
            width: clamp(140px, 36vw, 210px);
            max-width: 80%;
            height: auto;
            aspect-ratio: 561 / 620;
            object-fit: contain;
            user-select: none;
            -webkit-user-drag: none;
          "
        />
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
